<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Anti Extension Probe</title>
  <style>
    body {
      font: 14px/1.4 Arial, sans-serif;
      margin: 0;
      padding: 12px;
      width: 360px;
      color: #111;
      background: #fff;
    }
    .row { margin-bottom: 10px; }
    .status { padding: 8px 10px; background: #f3f4f6; border-radius: 8px; }
    .ok { color: #166534; font-weight: 700; }
    .muted { color: #555; }
    button {
      border: 0;
      background: #111827;
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    ul {
      padding-left: 18px;
      max-height: 240px;
      overflow: auto;
    }
    li { margin-bottom: 8px; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <div class="row status">
    <div><span class="ok">Running</span></div>
    <div class="muted" id="init"></div>
    <div class="muted" id="count"></div>
  </div>

  <div class="row">
    <button id="clear">Clear log</button>
  </div>

  <div class="row">
    <strong>Recent activity</strong>
    <ul id="logs"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
