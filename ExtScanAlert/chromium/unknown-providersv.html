<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ExtScanAlert – Candidate providers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    p {
      margin: 0 0 8px;
      color: var(--muted);
    }
    select,
    button {
      width: 100%;
      margin-bottom: 8px;
      font: inherit;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
    }
    button.primary {
      background: rgba(96, 165, 250, 0.14);
      border-color: rgba(96, 165, 250, 0.4);
    }
    textarea {
      width: 100%;
      min-height: 180px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      resize: vertical;
    }
    .status {
      min-height: 20px;
      font-size: 12px;
      color: var(--muted);
    }
    .status.ok {
      color: #86efac;
    }
    .status.error {
      color: #fca5a5;
    }
	#candidate-stats {
  font-size: 15px;
  line-height: 1.6;
  white-space: normal;
}

#candidate-stats strong {
  font-weight: 700;
  color: var(--text);
}

@media (max-width: 768px) {
  #candidate-stats {
    font-size: 16px;
    line-height: 1.65;
  }
}
  </style>
</head>
<body class="theme-dark">
  <main class="wrap">
    <header>
      <h1>Candidate providers</h1>
      <p>
        Review potential provider script hosts and copy JSON snippets to add them
        to providers.json later.
      </p>
    </header>

<section>
  <label>
    Choose candidate
    <select id="candidate-select"></select>
  </label>

  <div id="candidate-stats" class="small muted">
    <!-- Filled by JS -->
  </div>

  <button id="copy-json" type="button" class="primary">
    Copy provider JSON
  </button>
  <textarea id="candidate-json" readonly></textarea>
</section>

    <p id="status" class="status"></p>
  </main>

  <script src="unknown-providersv.js"></script>
</body>
</html>
