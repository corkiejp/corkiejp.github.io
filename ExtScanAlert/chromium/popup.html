<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ExtScanAlert</title>
  <style>
    body { font: 14px/1.4 Arial, sans-serif; margin: 0; padding: 12px; width: 380px; color: #111; background: #fff; }
    .row { margin-bottom: 12px; }
    .status { padding: 8px 10px; background: #f3f4f6; border-radius: 8px; }
    .ok { color: #166534; font-weight: 700; }
    .muted { color: #555; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; }
    button { border: 1px solid #cbd5e1; background: #fff; color: #111827; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    button.active { background: #111827; color: #fff; border-color: #111827; }
    label { display: flex; align-items: center; gap: 8px; }
    ul { padding-left: 18px; max-height: 260px; overflow: auto; }
    li { margin-bottom: 8px; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <div class="row status">
    <div><span class="ok">Running</span></div>
    <div class="muted" id="init"></div>
    <div class="muted" id="summary"></div>
  </div>

  <div class="row">
    <div class="muted">Mode</div>
    <div class="controls">
      <button id="mode-block">Block all</button>
      <button id="mode-log">Log only</button>
      <button id="mode-allow">Allow all</button>
    </div>
  </div>

  <div class="row">
    <label><input type="checkbox" id="notifications"> Notify once per host when blocked</label>
  </div>

<label>
  <input type="checkbox" id="slow-page-protection">
  Enable slow‑page protection (block known heavy widgets)
</label>

  <div class="row">
    <button id="clear">Clear log</button>
  </div>

  <div class="row">
    <strong>Recent activity</strong>
    <ul id="logs"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
