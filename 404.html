<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      const url = new URL(window.location.href);
      const marker = '/ATProtocolHandler/';
      const idx = url.pathname.indexOf(marker);

      if (idx === -1) {
        window.location.replace(url.origin + '/');
        return;
      }

      const rawAt = decodeURIComponent(url.pathname.slice(idx + marker.length));
      const target = new URL(url.origin + '/ATProtocolHandler/');
      target.searchParams.set('at', rawAt);

      for (const [key, value] of url.searchParams.entries()) {
        if (key !== 'at') target.searchParams.set(key, value);
      }

      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
