<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share Target PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0074d9">
  <link rel="icon" href="assets/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<style>
a {
  display: block;
  margin: 0.5em 0;
  padding: 0.25em 0;
  background: #0074d9;
  color: #fff !important;
  text-decoration: none;
  border-radius: 0.5em;
  font-size: 1.1em;
  font-weight: 600;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.07);
  transition: background 0.15s, transform 0.1s;
}
a:hover, a:active, a:focus {
  background: #005fa3;
  color: #fff !important;
  transform: scale(1.03);
}
</style>

</head>
<body>
  <h1>Share Target PWA</h1>
  <div id="output"></div>
<script>

async function resolveHandleToDid(handle) {
  // Use the official Bluesky endpoint
  const url = `https://bsky.social/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(handle)}`;
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("Failed to resolve handle");
    const data = await response.json();
    return data.did; // Returns the DID string
  } catch (e) {
    console.error("Handle resolution failed:", e);
    return null;
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  let output = '';
  for (const [key, value] of params.entries()) {
    output += `<pre style="font-size:0.9em;color:#555;background:#f9f9f9;padding:0.5em;border-radius:0.3em;">
[Developer Note] Raw share parameters received from Bluesky Share Target:
${JSON.stringify(params, null, 2)}
</pre>`;
    output += `<b>${key}</b>: ${value}<br><br>Open this post in below sites, if you didn't share from a post, see note appended at botom.<br>`;
//    output += `<br><a href="${value}" target="_blank">Bluesky</a>`; scripted better below!
    // Default: use the value as the AT URI (if it's already in AT URI format)
    let atUri = value;
    let did = null;
    let rkey = null;

    // --- Detection Flags ---
    let isBlueskyPostUrl = false;
    let isPostAtUri = false;

    // If it's a Bluesky web URL, try to extract the DID and rkey
    if (value.startsWith('https://bsky.app/profile/')) {
      const urlParts = value.split('/');
      if (urlParts.length >= 7 && urlParts[5] === 'post') {
        did = urlParts[4];
        rkey = urlParts[6];
        atUri = `at://${did}/app.bsky.feed.post/${rkey}`;
        isBlueskyPostUrl = true;
      }
    } else if (value.startsWith('at://')) {
      // If it's already an AT URI, extract DID and rkey if possible
      const match = value.match(/^at:\/\/([^/]+)\/app\.bsky\.feed\.post\/([^/]+)/);
      if (match) {
        did = match[1];
        rkey = match[2];
        isPostAtUri = true;
      }
    }

    // Now you can safely use did and atUri for sites that require them
    if (atUri) {
      output += `<a href="https://corkiejp.github.io/ATProtoViewer/index.html?uri=${encodeURIComponent(atUri)}" target="_blank">Corkiejps ATProtoViewer</a>`;
      output += `<a href="https://atproto.at/viewer?uri=${encodeURIComponent(atUri)}" target="_blank">ATProto.at Viewer</a>`;
      output += `<a href="https://blue.mackuba.eu/skythread/?q=${encodeURIComponent(atUri)}" target="_blank">Skythread by Kuba</a>`;
      output += `<a href="https://skyview.social/?url=${encodeURIComponent(atUri)}" target="_blank">Skyview Social</a>`;
      output += `<a href="https://pdsls.dev/${atUri}" target="_blank">pdsls.dev</a>`;
      output += `<a href="https://atp.tools/${atUri}" target="_blank">atp.tools</a>`;
    }
    if (did && rkey) {
      output += `<a href="https://bsky.app/profile/${did}/post/${rkey}" target="_blank">Bluesky</a>`;	
      output += `<a href="https://deer.social/profile/${did}/post/${rkey}" target="_blank">Deer Social</a>`;
      output += `<a href="https://klearsky.pages.dev/#/post?uri=at://${did}/app.bsky.feed.post/${rkey}" target="_blank">Klearsky</a>`;
	  output += "<br><br>Only use below if post has a video!<br>";
	  output += `<a href="https://blueskytomp4.com/?url=https://bsky.app/profile/${did}/post/${rkey}" target="_blank">blueskytomp4.com</a>`;	  
    }
    if (did) {
      output += "<br><br>Look up profiles below!<br>";
      output += `<a href="https://bluefacts.app/profile/${did}" target="_blank">NEW | bluefacts.app</a>`;	
      output += `<a href="https://cred.blue/${did}" target="_blank">Cred.blue</a>`;
      output += `<a href="https://toolify.blue/profile/${did}" target="_blank">Toolify.blue</a>`;
      output += `<a href="https://clearsky.app/${did}/history" target="_blank">clearsky</a>`;
      output += `<a href="https://atproto.at/viewer?uri=${did}" target="_blank">atproto.at profile</a>`;
      output += `<br><br><a href="https://corkiejp.github.io/ATProtoViewer/Blueskyessentiallinks.html" target="_blank">Bluesky essential links</a>`;
    }
    output += "<br><br><b>Note: -</b> PLC Directory lookup requires a DID string and this script only has handles, But atproto.at has a display of that info and a link to that information. So click on DID Doc there? So no need to provide a direct link here?";

    // --- Show a note if neither accepted condition is met ---
    if (!isBlueskyPostUrl && !isPostAtUri) {
      output += `
        <div style="margin:1em 0; color:#d9534f; font-size:1em;">
          <strong>Note:</strong> This app currently only supports sharing Bluesky post links.<br>
          Profile shares or other formats may not work as expected.<br>
          For profile lookups, use my other PWA directly instead: -
          <a href="https://corkiejp.github.io/ATProtoViewer/index.html?uri=${encodeURIComponent(value)}" target="_blank" style="color:#0074d9;text-decoration:underline;">ATProtoViewer not a DID</a>.
		  <a href="https://corkiejp.github.io/ATProtoViewer/index.html?did=${encodeURIComponent(value)}" target="_blank" style="color:#0074d9;text-decoration:underline;">ATProtoViewer if a DID</a>.
        </div>
      `;
    }
  }

  document.body.innerHTML += `<div><h3>Received Share Parameters:</h3>${output || "None"}</div>`;
  console.log("Received share params:", Object.fromEntries(params.entries()));
});

function getParams() {
  const params = new URLSearchParams(window.location.search);
  const result = {};
  for (const [key, value] of params.entries()) {
    result[key] = value;
  }
  return result;
}

function isDesktop() {
  // Simple check for mobile devices
  return !/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function displayParams(params) {
  const output = document.getElementById('output');
  output.innerHTML = ""; // Clear previous content

  if (Object.keys(params).length === 0) {
    output.textContent = "No share parameters received. Only works as a Mobile PWA share target! Use the below QR Code to Install on mobile! If on mobile already just choose the option from menu to 'Add to home screen'";

    // Only show image if on desktop
    if (isDesktop()) {
      const img = document.createElement('img');
      img.src = 'assets/qrcode_corkiejp.github.io.ttospwa.png';
      img.alt = 'QR Code of the PWA for install on Android!';
      img.className = 'modal-img';
      img.style.marginTop = '1em';
      output.appendChild(document.createElement('br'));
      output.appendChild(img);
    }
  } else {
    output.innerHTML = '<pre>' + JSON.stringify(params, null, 2) + '</pre>';
  }
  console.log("Received share params:", params);
}


window.addEventListener('DOMContentLoaded', () => {
  const params = getParams();
  displayParams(params);
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./service-worker.js').then(function(registration) {
      console.log('ServiceWorker registration successful:', registration.scope);
    }, function(err) {
      console.log('ServiceWorker registration failed:', err);
    });
  });
}
</script>

</body>
</html>
