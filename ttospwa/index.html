<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share Target Test PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0074d9">
  <link rel="icon" href="assets/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Share Target Test PWA</h1>
  <div id="output"></div>
  <script>
  
  // index.html or main.js
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  let output = '';
for (const [key, value] of params.entries()) {
  output += `<b>${key}</b>: ${value}<br>Open this post in below sites<br>`;
  output += `<br><a href="${value}" target="_blank">Bluesky</a>`;
  // Default: use the value as the AT URI (if it's already in AT URI format)
  let atUri = value;
  let did = null;
  let rkey = null;

  // If it's a Bluesky web URL, try to extract the DID and rkey
  if (value.startsWith('https://bsky.app/profile/')) {
    const urlParts = value.split('/');
    if (urlParts.length >= 7 && urlParts[5] === 'post') {
      did = urlParts[4];
      rkey = urlParts[6];
      atUri = `at://${did}/app.bsky.feed.post/${rkey}`;
    }
  } else if (value.startsWith('at://')) {
    // If it's already an AT URI, extract DID and rkey if possible
    const match = value.match(/^at:\/\/([^/]+)\/app\.bsky\.feed\.post\/([^/]+)/);
    if (match) {
      did = match[1];
      rkey = match[2];
    }
  }

  // Now you can safely use did and atUri for sites that require them
  if (atUri) {
    output += `<br><a href="https://corkiejp.github.io/ATProtoViewer/index.html?uri=${encodeURIComponent(atUri)}" target="_blank">Corkiejps ATProtoViewer</a>`;
    output += `<br><a href="https://atproto.at/viewer?uri=${encodeURIComponent(atUri)}" target="_blank">ATProto.at Viewer</a>`;
    output += `<br><a href="https://blue.mackuba.eu/skythread/?q=${encodeURIComponent(atUri)}" target="_blank">Skythread by Kuba</a>`;
	output += `<br><a href="https://skyview.social/?url=${encodeURIComponent(atUri)}" target="_blank">Skyview Social</a>`;
	output += `<br><a href="https://pdsls.dev/${encodeURIComponent(atUri)}" target="_blank">pdsls.dev</a>`;	
	output += `<br><a href="https://atp.tools/${encodeURIComponent(atUri)}" target="_blank">atp.tools</a>`;
	
	
  }
  if (did && rkey) {
    output += `<br><a href="https://deer.social/profile/${did}/post/${rkey}" target="_blank">Deer Social</a>`;
    output += `<br><a href="https://klearsky.pages.dev/#/post?uri=at://${did}/app.bsky.feed.post/${rkey}" target="_blank">Deer Social</a>`;	
  }
  if (did) {
    output += "<br><br>Look up profiles below!<br>";
    output += `<br><a href="https://plc.directory/${did}" target="_blank">PLC Directory ~ Not working due to looking up a Handle.</a>`;
    output += `<br><a href="https://cred.blue/${did}" target="_blank">Cred.blue</a>`;
    output += `<br><a href="https://toolify.blue/profile/${did}" target="_blank">Toolify.blue</a>`;
  }
  output += "<br><br>As noted handle lookup provided here doesn't work due to constraints of HTML/JS used, see my ATProtoViewer for those kind of look ups?";
}

  document.body.innerHTML += `<div><h3>Received Share Parameters:</h3>${output || "None"}</div>`;
  console.log("Received share params:", Object.fromEntries(params.entries()));
});

    function getParams() {
      const params = new URLSearchParams(window.location.search);
      const result = {};
      for (const [key, value] of params.entries()) {
        result[key] = value;
      }
      return result;
    }

    function displayParams(params) {
      const output = document.getElementById('output');
      if (Object.keys(params).length === 0) {
        output.textContent = "No share parameters received.";
      } else {
        output.innerHTML = '<pre>' + JSON.stringify(params, null, 2) + '</pre>';
      }
      console.log("Received share params:", params);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = getParams();
      displayParams(params);
    });
  </script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./service-worker.js').then(function(registration) {
      console.log('ServiceWorker registration successful:', registration.scope);
    }, function(err) {
      console.log('ServiceWorker registration failed:', err);
    });
  });
}
</script>


</body>
</html>
