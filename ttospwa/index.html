<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share Target Test PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0074d9">
  <link rel="icon" href="assets/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Share Target Test PWA</h1>
  <div id="output"></div>
  <script>
  
  // index.html or main.js
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  let output = '';
for (const [key, value] of params.entries()) {
  output += `<b>${key}</b>: ${value}<br>Open in below<br><a href="${value}" target="_blank">Bluesky</a>`;
  // Convert and add ATProto Viewer link
  let atUri = value;
  if (value.startsWith('https://bsky.app/profile/')) {
    const parts = value.split('/');
    if (parts.length >= 6) {
      atUri = `at://${parts[4]}/app.bsky.feed.post/${parts[6] || parts[5]}`;
    }
  }
  output += `<br><a href="https://corkiejp.github.io/ATProtoViewer/index.html?uri=${encodeURIComponent(atUri)}" target="_blank">Corkiejps ATProtoViewer</a>
  <br><a href="https://atproto.at/viewer?uri=${encodeURIComponent(atUri)}" target="_blank">ATProto at Viewer</a>
  <br><a href="https://blue.mackuba.eu/skythread/?q=${encodeURIComponent(atUri)}" target="_blank">Skythread by Kuba</a>`;
  

}
  document.body.innerHTML += `<div><h3>Received Share Parameters:</h3>${output || "None"}</div>`;
  console.log("Received share params:", Object.fromEntries(params.entries()));
});

    function getParams() {
      const params = new URLSearchParams(window.location.search);
      const result = {};
      for (const [key, value] of params.entries()) {
        result[key] = value;
      }
      return result;
    }

    function displayParams(params) {
      const output = document.getElementById('output');
      if (Object.keys(params).length === 0) {
        output.textContent = "No share parameters received.";
      } else {
        output.innerHTML = '<pre>' + JSON.stringify(params, null, 2) + '</pre>';
      }
      console.log("Received share params:", params);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = getParams();
      displayParams(params);
    });
  </script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./service-worker.js').then(function(registration) {
      console.log('ServiceWorker registration successful:', registration.scope);
    }, function(err) {
      console.log('ServiceWorker registration failed:', err);
    });
  });
}
</script>


</body>
</html>
