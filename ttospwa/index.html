<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share Target PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0074d9">
  <link rel="icon" href="assets/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<style>
body {
  background: #f7f7f7;
  margin: 0;
  padding: 0;
  font-family: system-ui, Arial, sans-serif;
  overflow-x: hidden; /* Prevent horizontal scroll */
}

.main-container {
  max-width: 420px;
  margin: 2em auto;
  padding: 1.2em;
  background: #fff;
  border-radius: 1em;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  box-sizing: border-box;
}

#output {
  width: 100%;
  box-sizing: border-box;
  word-break: break-all;
  overflow-wrap: anywhere;
  max-width: 100vw;
}

a {
  display: block;
  margin: 0.5em auto;
  padding: 0.25em 0;
  background: #0074d9;
  color: #fff !important;
  text-decoration: none;
  border-radius: 0.5em;
  font-size: 1.1em;
  font-weight: 600;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.07);
  transition: background 0.15s, transform 0.1s;
  max-width: 340px;
}

a:hover, a:active, a:focus {
  background: #005fa3;
  color: #fff !important;
  transform: scale(1.03);
}

/* Ensure all pre/code blocks wrap and don't overflow */
pre, code {
  white-space: pre-wrap;
  word-break: break-all;
  overflow-x: auto;
  max-width: 100vw;
  box-sizing: border-box;
}

/* Wrap long words/URIs in output and other elements */
.output-wrap, b, span, div {
  word-break: break-all;
  overflow-wrap: anywhere;
  box-sizing: border-box;
  max-width: 100vw;
}

@media (max-width: 600px) {
  .main-container {
    max-width: 100vw;
    margin: 0;
    padding: 0.5em;
    border-radius: 0;
    box-shadow: none;
  }
  a {
    max-width: 100%;
    border-radius: 0.5em;
  }
  pre, code, #output, .output-wrap {
    font-size: 1em;
  }
}

.main-container,
#output {
  text-align: center;
}

pre {
  text-align: left;   /* Keeps code/JSON readable */
  margin-left: auto;
  margin-right: auto;
  display: block;
}

.center-note {
  text-align: center;
  margin-left: auto;
  margin-right: auto;
}


</style>

</head>
<body>
<div class="main-container">
  <h1>Share Target PWA</h1>
  <div id="output"></div>
</div>
<script>

async function resolveHandleToDid(handle) {
  // Use the official Bluesky endpoint
  const url = `https://bsky.social/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(handle)}`;
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("Failed to resolve handle");
    const data = await response.json();
    return data.did; // Returns the DID string
  } catch (e) {
    console.error("Handle resolution failed:", e);
    return null;
  }
}

function fetchHandleFromDid(did) {
  return fetch(`https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=${did}`)
    .then(resp => resp.json())
    .then(data => data.handle || did)
    .catch(() => did);
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  let output = '';
  for (const [key, value] of params.entries()) {
    output += `<div class="center-note">
[Developer Note] Raw share parameters received from Bluesky Share Target:
${JSON.stringify(params, null, 2)}
</div>`;
    output += `<b>${key}</b>: ${value}<br><br>Open this post in below sites, if you didn't share from a post, see note appended at botom.<br>`;

    let atUri = value;
    let did = null;
    let rkey = null;

    // --- Detection Flags ---
    let isBlueskyPostUrl = false;
    let isPostAtUri = false;

    // Bluesky web URL
    if (value.startsWith('https://bsky.app/profile/')) {
      const urlParts = value.split('/');
      if (urlParts.length >= 7 && urlParts[5] === 'post') {
        did = urlParts[4];
        rkey = urlParts[6];
        atUri = `at://${did}/app.bsky.feed.post/${rkey}`;
        isBlueskyPostUrl = true;
      }
    }
    // Deer Social web URL
    else if (value.startsWith('https://deer.social/profile/')) {
      const urlParts = value.split('/');
      if (urlParts.length >= 7 && urlParts[5] === 'post') {
        did = urlParts[4];
        rkey = urlParts[6];
        atUri = `at://${did}/app.bsky.feed.post/${rkey}`;
        isBlueskyPostUrl = true; // treat as post URL for output
      }
    }
    // at:// URI
    else if (value.startsWith('at://')) {
      const match = value.match(/^at:\/\/([^/]+)\/app\.bsky\.feed\.post\/([^/]+)/);
      if (match) {
        did = match[1];
        rkey = match[2];
        isPostAtUri = true;
      }
    }

    // ... (rest of your output logic remains unchanged)
    // Now you can safely use did and atUri for sites that require them
    if (atUri) {
      output += `<a href="https://atp.tools/${atUri}" target="_blank">atp.tools</a>`;
      output += `<a href="https://corkiejp.github.io/ATProtocolHandler/${atUri}" target="_blank">AT Handler + custom links</a>`;	  
      output += `<a href="https://corkiejp.github.io/ATProtoViewer/index.html?uri=${encodeURIComponent(atUri)}" target="_blank">ATProtoViewer (Corkiejps)</a>`;
      output += `<a href="https://atproto.at/viewer?uri=${encodeURIComponent(atUri)}" target="_blank">ATProto.at Viewer</a>`;
      output += `<a href="https://blue.mackuba.eu/skythread/?q=${encodeURIComponent(atUri)}" target="_blank">Skythread by Kuba</a>`;
      output += `<a href="https://skyview.social/?url=${encodeURIComponent(atUri)}" target="_blank">Skyview Social</a>`;
      output += `<a href="https://pdsls.dev/${atUri}" target="_blank">pdsls.dev</a>`;
    }

    if (did && rkey) {
      output += `<a href="https://blueviewer.pages.dev/view?actor=${did}&rkey=${rkey}" target="_blank">blueviewer.pages.dev</a>`;
      output += "<div class=\"center-note\">AppViews</div>";
      output += `<a href="https://azsky.app/profile/${did}/post/${rkey}" target="_blank">Azsky</a>`;
      output += `<a href="https://bsky.app/profile/${did}/post/${rkey}" target="_blank">Bluesky</a>`;
      output += `<a href="https://deer.social/profile/${did}/post/${rkey}" target="_blank">Deer Social</a>`;
      output += `<a href="https://klearsky.pages.dev/#/post?uri=at://${did}/app.bsky.feed.post/${rkey}" target="_blank">Klearsky</a>`;
      output += `<a href="https://reddwarf.whey.party/profile/${did}/post/${rkey}" target="_blank">Red Dwarf Lite ~ (direct PDS queries)</a>`;
	  output += `<a href="https://mu.social/profile/${did}/post/${rkey}" target="_blank">mu.social</a>`;
      output += `<a href="https://wsocial.eu/profile/${did}/post/${rkey}" target="_blank">WSOCIAL.EU</a>`;	  
      output += `<span id="blueskytomp4-link-${rkey}"></span>`;
      document.getElementById('output').innerHTML = output;
      fetchHandleFromDid(did).then(handle => {
        const blueskyMp4Html = `
          <div class="center-note">Only use below if post has a video! And page was opened from bluesky share of the post!</div>
          <a href="https://blueskytomp4.com/?url=https://bsky.app/profile/${handle}/post/${rkey}" target="_blank">blueskytomp4.com</a>
          <div class="center-note">Look up profiles below!</div>
          <a href="https://bskycopilot.com/?handle=${handle}" target="_blank">bskycopilot.com</a>
        `;
        document.getElementById(`blueskytomp4-link-${rkey}`).innerHTML = blueskyMp4Html;
      });
    }

    if (did) {
      output += `<a href="https://atproto.at/viewer?uri=${did}" target="_blank">atproto.at profile</a>`;
      output += `<a href="https://bluefacts.app/profile/${did}" target="_blank">bluefacts.app</a>`;
      output += `<a href="https://blueview.app/public/${did}" target="_blank">blueview.app</a>`;
      output += `<a href="https://clearsky.app/${did}/history" target="_blank">clearsky</a>`;	  
      output += `<a href="https://cred.blue/${did}" target="_blank">Cred.blue</a>`;
      output += `<a href="https://skykit.blue/${did}" target="_blank">skykit.blue</a>`;	  
      output += `<a href="https://skytools.anon5r.com/profile/${did}" target="_blank">skytools.anon5r.com`;	  
      output += `<a href="https://toolify.blue/profile/${did}" target="_blank">Toolify.blue</a>`;
      output += `<br><br><a href="https://corkiejp.github.io/ATProtoViewer/Blueskyessentiallinks.html" target="_blank">Bluesky essential links</a>`;
    }
    output += '<div class="center-note"><b>Note: -</b> PLC Directory lookup requires a DID string and this script only has handles.<br> But atproto.at has a display of that info and a link to that information.<br> So click on DID Doc there? So no need to provide a direct link here? <br><a href="https://github.com/corkiejp/corkiejp.github.io/blob/well-known/ttospwa/noteonthispwa.md" target="_blank">More Notes</a></div>';

    // --- Show a note if neither accepted condition is met ---
    if (!isBlueskyPostUrl && !isPostAtUri) {
      output += `
        <div style="margin:1em 0; color:#d9534f; font-size:1em;">
          <strong>Note:</strong> This app currently only supports sharing Bluesky or Deer Social post links.<br>
          Profile shares or other formats may not work as expected.<br>
          For profile lookups, use my other PWA directly instead: -
          <a href="https://corkiejp.github.io/ATProtoViewer/index.html?uri=${encodeURIComponent(value)}" target="_blank" style="color:#0074d9;text-decoration:underline;">ATProtoViewer not a DID</a>.
          <a href="https://corkiejp.github.io/ATProtoViewer/index.html?did=${encodeURIComponent(value)}" target="_blank" style="color:#0074d9;text-decoration:underline;">ATProtoViewer if a DID</a>.
        </div>
      `;
    }
  }

  document.body.innerHTML += `<div class="center-note"><h3>Received Share Parameters:</h3>${output || "None"}</div>`;
  console.log("Received share params:", Object.fromEntries(params.entries()));
});


function getParams() {
  const params = new URLSearchParams(window.location.search);
  const result = {};
  for (const [key, value] of params.entries()) {
    result[key] = value;
  }
  return result;
}

function isDesktop() {
  // Simple check for mobile devices
  return !/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function displayParams(params) {
  const output = document.getElementById('output');
  output.innerHTML = ""; // Clear previous content

  if (Object.keys(params).length === 0) {
    output.textContent = "No share parameters received. Only works as a Mobile PWA share target or when linked from my main PWA and Chrome Extension! Use the below QR Code to Install on mobile! If on mobile already just choose the option from menu to 'Add to home screen'";

    // Only show image if on desktop
    if (isDesktop()) {
      const img = document.createElement('img');
      img.src = 'assets/qrcode_corkiejp.github.io.ttospwa.png';
      img.alt = 'QR Code of the PWA for install on Android!';
      img.className = 'modal-img';
      img.style.marginTop = '1em';
      output.appendChild(document.createElement('br'));
      output.appendChild(img);
    }
  } else {
    output.innerHTML = '<pre>' + JSON.stringify(params, null, 2) + '</pre>';
  }
  console.log("Received share params:", params);
}


window.addEventListener('DOMContentLoaded', () => {
  const params = getParams();
  displayParams(params);
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./service-worker.js').then(function(registration) {
      console.log('ServiceWorker registration successful:', registration.scope);
    }, function(err) {
      console.log('ServiceWorker registration failed:', err);
    });
  });
}
</script>

</body>
</html>
