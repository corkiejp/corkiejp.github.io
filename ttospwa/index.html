<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share Target Test PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0074d9">
  <link rel="icon" href="assets/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Share Target Test PWA</h1>
  <div id="output"></div>


<script>
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const sharedInput = params.get('uri'); // Get the shared value from "uri" parameter
  
  if (!sharedInput) {
    document.getElementById('output').textContent = "No share parameters received.";
    return;
  }

  // Parse both URL formats: bsky.app links and raw AT URIs
  const { atUri, did, collection, rkey } = parseSharedInput(sharedInput);
  
  if (!atUri) {
    document.getElementById('output').textContent = "Invalid Bluesky share format";
    return;
  }

  // Generate viewer links
  const viewers = {
    "ATProto Viewer": `https://atproto.at/viewer?uri=${encodeURIComponent(atUri)}`,
    "Skyview": `https://skyview.social/?url=${encodeURIComponent(atUri)}`,
    "Deer Social": `https://deer.social/profile/${did}/post/${rkey}`,
    "PDSLabs Dev": `https://pdsls.dev/${atUri}`,
    "PLC Directory": `https://plc.directory/${did}`
  };

  // Display links
  const output = document.getElementById('output');
  output.innerHTML = `
    <h3>View This On:</h3>
    ${Object.entries(viewers).map(([name, url]) => `
      <div style="margin: 10px 0;">
        <a href="${url}" target="_blank" style="
          display: inline-block;
          padding: 8px 15px;
          background: #1185fe;
          color: white;
          border-radius: 4px;
          text-decoration: none;
        ">${name}</a>
      </div>
    `).join('')}
  `;
});

function parseSharedInput(input) {
  let did, collection, rkey;
  
  // Handle AT URI format: at://did/app.bsky.feed.post/rkey
  if (input.startsWith('at://')) {
    [,, did, collection, rkey] = input.split('/');
    return { atUri: input, did, collection, rkey };
  }
  
  // Handle web URL format: https://bsky.app/profile/did/post/rkey
  const urlMatch = input.match(/https:\/\/bsky\.app\/profile\/([^/]+)\/post\/([^/?#]+)/);
  if (urlMatch) {
    [, did, rkey] = urlMatch;
    collection = 'app.bsky.feed.post';
    return {
      atUri: `at://${did}/${collection}/${rkey}`,
      did,
      collection,
      rkey
    };
  }

  return {}; // Invalid format
}
</script>



<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./service-worker.js').then(function(registration) {
      console.log('ServiceWorker registration successful:', registration.scope);
    }, function(err) {
      console.log('ServiceWorker registration failed:', err);
    });
  });
}
</script>


</body>
</html>
